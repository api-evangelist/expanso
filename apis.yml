aid: expanso
name: Expanso
description: >-
  Expanso is the company behind Bacalhau, an open-source distributed compute
  orchestration framework that brings compute to the data by running jobs close
  to where data is generated across edge, on-premise, and cloud environments.
  Expanso Cloud is the managed platform for deploying intelligent data pipelines
  at the edge - filtering, transforming, and governing data (PII/GDPR compliance,
  lineage) before it reaches downstream platforms like Snowflake and Databricks.
  The Bacalhau Orchestrator API exposes job submission, execution history,
  results, log streaming, and node/agent management over a versioned REST
  interface. Expanso is backed by General Catalyst and was named Edge AI Startup
  of the Year 2026.
